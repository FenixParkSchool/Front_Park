<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de veículos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    :root {
      --park-bg: #edf3ff;
      --park-card: #ffffff;
      --park-card-soft: #f5f8ff;
      --park-border: #dfe7f5;
      --park-primary: #1d397d;
      --park-primary-strong: #142a60;
      --park-secondary: #1c4966;
      --park-text: #10233f;
      --park-muted: #64748b;
    }

    body {
      background: linear-gradient(135deg, #eaf1ff 0%, #f4f8ff 35%, #edf3fb 100%);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--park-text);
    }

    .vehicle-shell {
      max-width: 960px;
      margin: 42px auto;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--park-border);
      border-radius: 22px;
      box-shadow: 0 22px 54px rgba(29, 57, 125, 0.12);
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    .vehicle-header {
      background: linear-gradient(135deg, var(--park-primary) 0%, var(--park-secondary) 100%);
      color: white;
      padding: 30px 32px 26px;
    }

    .vehicle-header h1 {
      font-size: clamp(1.9rem, 2.8vw, 2.6rem);
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .vehicle-header p {
      color: rgba(255,255,255,0.8);
      font-size: 0.98rem;
      margin-top: 10px;
    }

    .vehicle-body {
      padding: 30px 28px 32px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }

    .card-vehicle {
      background: var(--park-card-soft);
      border: 1px solid var(--park-border);
      border-radius: 16px;
      padding: 20px 18px 18px;
      margin-bottom: 18px;
      position: relative;
      box-shadow: 0 8px 22px rgba(16, 35, 63, 0.04);
    }

    .vehicle-number {
      color: var(--park-primary);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.78rem;
      color: var(--park-muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .form-control,
    .form-select {
      border: 1px solid #d5dfef;
      border-radius: 10px;
      min-height: 46px;
      background: white;
      color: var(--park-text);
      padding: 0.75rem 0.9rem;
      font-size: 0.95rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--park-primary);
      box-shadow: 0 0 0 0.2rem rgba(29, 57, 125, 0.12);
    }

    .btn-primary-park {
      background: linear-gradient(135deg, var(--park-primary) 0%, var(--park-primary-strong) 100%);
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 20px rgba(29, 57, 125, 0.18);
    }

    .btn-primary-park:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #243c8e 0%, #102c67 100%);
    }

    .btn-outline-park {
      border: 1.5px solid var(--park-primary);
      color: var(--park-primary);
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      background: #fff;
      transition: all 0.2s ease;
    }

    .btn-outline-park:hover {
      background: #eef4ff;
      border-color: var(--park-primary-strong);
      color: var(--park-primary-strong);
    }

    .btn-outline-danger {
      border-radius: 10px;
      padding: 0.4rem 0.7rem;
    }
  </style>
</head>
<body data-page="cadastroVeiculo" data-access-required="true" data-access-state="checking">
  <div id="access-state" class="access-state" role="status" aria-live="polite">
    <div class="access-state__panel">
      <p id="access-message" class="mb-3">Verificando acesso...</p>
      <button id="access-retry" class="ds-btn-primary" type="button" hidden>Tentar novamente</button>
    </div>
  </div>
  <div id="access-feedback" class="access-feedback" role="alert" aria-live="assertive" hidden></div>
  <div class="vehicle-shell">
    <div class="vehicle-header">
      <h1>Cadastro de veículos</h1>
      <p class="mb-0 mt-2 opacity-75">Adicione os veículos do usuário antes de finalizar o cadastro.</p>
    </div>

    <div class="vehicle-body">
      <form id="formVeiculos" novalidate>
        <div id="listaVeiculos"></div>

        <div class="d-flex flex-column flex-md-row gap-2 mt-3">
          <button type="button" class="btn btn-outline-park flex-fill" id="btnAdicionarVeiculo">
            <i class="fa-solid fa-plus me-2"></i>Adicionar outro veículo
          </button>
          <button type="submit" class="btn btn-primary-park flex-fill">
            <i class="fa-solid fa-check me-2"></i>Salvar veículos
          </button>
        </div>
      </form>
    </div>
  </div>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
